<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Clientes</title>
</head>
<body>
  <h1>Lista de Clientes</h1>
  <ul id="lista-clientes"></ul>

  <script>
    fetch('https://bluecoat21.github.io/servicio-clientes/clientes.json')
      .then(res => res.json())
      .then(data => {
        const lista = document.getElementById('lista-clientes');
        data.forEach(cliente => {
          const li = document.createElement('li');
          li.textContent = `${cliente.id} - ${cliente.nombre} (${cliente.tipo_cliente})`;
          lista.appendChild(li);
        });
      });
  </script>
</body>
</html>
